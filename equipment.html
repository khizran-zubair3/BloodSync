<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment - BloodSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .status-pill { padding: 6px 15px; border-radius: 50px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
        .status-operational { background: #e8f5e9; color: #2e7d32; }
        .status-under-maintenance { background: #fff3e0; color: #ef6c00; }
        .status-out-of-order { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0 text-dark fw-bold">Equipment Management</h4>
                <small class="text-muted">Track and maintain lab equipment</small>
            </div>
            <button id="btnAddEquip" class="btn btn-dark" style="display:none;" data-bs-toggle="modal" data-bs-target="#equipModal">
                <i class="bi bi-plus-lg me-1"></i> Add Equipment
            </button>
        </div>

        <div class="card table-card">
            <div class="card-body p-4">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Equipment Name</th>
                            <th>Status</th>
                            <th>Last Maintenance</th>
                            <th class="text-end admin-only">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="equipTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="equipModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Add Equipment</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addEquipForm">
                        <div class="mb-3"><label class="fw-bold text-dark">Equipment Name</label><input type="text" class="form-control" id="eqName" required></div>
                        <div class="mb-3">
                            <label class="fw-bold text-dark">Status</label>
                            <select class="form-select" id="eqStatus"><option>Operational</option><option>Under Maintenance</option><option>Out of Order</option></select>
                        </div>
                        <div class="mb-3"><label class="fw-bold text-dark">Last Maintenance Date</label><input type="date" class="form-control" id="eqDate" required></div>
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Save Equipment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editEquipModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Equipment</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editEquipForm">
                        <input type="hidden" id="eeId">
                        <div class="mb-3"><label class="fw-bold text-dark">Equipment Name</label><input type="text" class="form-control" id="eeName" required></div>
                        <div class="mb-3">
                            <label class="fw-bold text-dark">Status</label>
                            <select class="form-select" id="eeStatus"><option>Operational</option><option>Under Maintenance</option><option>Out of Order</option></select>
                        </div>
                        <div class="mb-3"><label class="fw-bold text-dark">Last Maintenance Date</label><input type="date" class="form-control" id="eeDate" required></div>
                        <button type="submit" class="btn btn-secondary w-100 fw-bold py-2">Update Equipment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $("#sidebar-placeholder").load("sidebar.html", function() {
            document.getElementById('userRoleBadge').innerText = localStorage.getItem('role');
            if (localStorage.getItem('role') === 'Admin') {
                document.getElementById('btnAddEquip').style.display = 'block';
            } else {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

        const token = localStorage.getItem('token');
        function getStatusClass(status) {
            if(status === 'Operational') return 'status-operational';
            if(status === 'Under Maintenance') return 'status-under-maintenance';
            return 'status-out-of-order';
        }
        function getStatusIcon(status) {
            if(status === 'Operational') return 'bi-check-circle-fill';
            if(status === 'Under Maintenance') return 'bi-wrench-adjustable';
            return 'bi-x-octagon-fill';
        }

        async function loadEquipment() {
            const res = await fetch('http://localhost:5000/api/modules/equipment', { headers: { 'Authorization': token }});
            const data = await res.json();
            document.getElementById('equipTableBody').innerHTML = data.map(eq => `
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <div style="width: 45px; height: 45px; background: #f4f6f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #495057; margin-right: 15px;">
                                <i class="bi bi-cpu fs-5"></i>
                            </div>
                            <span class="fw-bold text-dark">${eq.name}</span>
                        </div>
                    </td>
                    <td><span class="status-pill ${getStatusClass(eq.status)}"><i class="bi ${getStatusIcon(eq.status)}"></i> ${eq.status}</span></td>
                    <td class="text-muted">${eq.last_maintenance}</td>
                    <td class="text-end admin-only">
                        <button class="btn btn-sm btn-outline-dark px-3" style="border-radius:10px;" onclick="openEdit(${eq.id}, '${eq.name}', '${eq.status}', '${eq.last_maintenance}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('addEquipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('http://localhost:5000/api/modules/equipment', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({ name: document.getElementById('eqName').value, status: document.getElementById('eqStatus').value, last_maintenance: document.getElementById('eqDate').value })
            });
            if(res.ok) { alert('Equipment Added!'); window.location.reload(); } else { alert('BLOCKED!'); }
        });

        function openEdit(id, name, status, date) {
            document.getElementById('eeId').value = id; document.getElementById('eeName').value = name; document.getElementById('eeStatus').value = status; document.getElementById('eeDate').value = date;
            new bootstrap.Modal(document.getElementById('editEquipModal')).show();
        }

        document.getElementById('editEquipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('eeId').value;
            const res = await fetch(`http://localhost:5000/api/modules/equipment/${id}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({ name: document.getElementById('eeName').value, status: document.getElementById('eeStatus').value, last_maintenance: document.getElementById('eeDate').value })
            });
            if(res.ok) { alert('Updated!'); window.location.reload(); } else { alert('BLOCKED!'); }
        });

        loadEquipment();
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
