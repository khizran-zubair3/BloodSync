<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - BloodSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .avatar-sm { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .role-badge { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; }
        .role-admin { background: #ffebee; color: #c62828; }
        .role-staff { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="adminContent">
            <div class="top-bar d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light d-md-none me-3 shadow-sm" id="sidebarToggle" style="border-radius: 10px;">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <div>
                        <h4 class="mb-0 text-dark fw-bold">Staff Management</h4>
                        <small class="text-muted">Create and manage system user roles</small>
                    </div>
                </div>
                <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#staffModal">
                    <i class="bi bi-person-plus-fill me-1"></i> Add Staff
                </button>
            </div>

            <div class="card table-card">
                <div class="card-body p-4">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Role</th>
                                <th>Created At</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="blockedContent" class="blocked-screen" style="display: none;">
            <div class="blocked-box">
                <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
                <h3 class="mt-3 text-dark fw-bold">Access Blocked</h3>
                <p class="text-muted mt-2">Staff Management is restricted to Admins only.</p>
                <a href="index.html" class="btn btn-outline-dark mt-3 px-4" style="border-radius:10px;"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
            </div>
        </div>
    </div>

    <!-- Modals Here -->
    <div class="modal fade" id="staffModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Create Account</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addStaffForm">
                        <div class="mb-3"><label class="fw-bold text-dark">Username</label><input type="text" class="form-control" id="sUsername" required></div>
                        <div class="mb-3"><label class="fw-bold text-dark">Password</label><input type="password" class="form-control" id="sPassword" required></div>
                        <div class="mb-3"><label class="fw-bold text-dark">Role</label><select class="form-select" id="sRole"><option>Staff</option><option>Admin</option></select></div>
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Create</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editRoleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Update Role</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editRoleForm">
                        <input type="hidden" id="erUserId">
                        <div class="mb-3"><label class="fw-bold text-dark">New Role</label><select class="form-select form-select-lg" id="erNewRole"><option>Staff</option><option>Admin</option></select></div>
                        <button type="submit" class="btn btn-secondary w-100 fw-bold py-2">Update</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const userRole = localStorage.getItem('role');

        // Load Sidebar
        $("#sidebar-placeholder").load("sidebar.html", function() {
            document.getElementById('userRoleBadge').innerText = userRole;
            if (userRole !== 'Admin') {
                document.getElementById('adminContent').style.display = 'none';
                document.getElementById('blockedContent').style.display = 'flex';
            }
        });

        // GLOBAL FUNCTIONS (Bahar rakhein taaki button kaam karein)
        function openRoleModal(id, role) {
            document.getElementById('erUserId').value = id; 
            document.getElementById('erNewRole').value = role;
            new bootstrap.Modal(document.getElementById('editRoleModal')).show();
        }

        function deleteStaff(id) {
            if(confirm('Are you sure you want to disable this user?')) {
                fetch(`http://localhost:5000/api/modules/staff/${id}`, {
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ role: 'Deleted' })
                })
                .then(res => {
                    if(res.ok) { 
                        alert('User Disabled Successfully!'); 
                        window.location.reload(); 
                    } else {
                        alert('Error disabling user.');
                    }
                });
            }
        }

        // Load Data if Admin
        if (userRole === 'Admin') {
            async function loadStaff() {
                const res = await fetch('http://localhost:5000/api/modules/staff', { headers: { 'Authorization': token }});
                const data = await res.json();
                const activeUsers = data.filter(s => s.role !== 'Deleted');
                
                document.getElementById('staffTableBody').innerHTML = activeUsers.map(s => {
                    let roleClass = s.role === 'Admin' ? 'role-admin' : 'role-staff';
                    let avatarBg = s.role === 'Admin' ? 'bg-danger' : 'bg-primary';
                    return `<tr>
                        <td><div class="d-flex align-items-center"><div class="avatar-sm ${avatarBg} me-3">${s.username.charAt(0).toUpperCase()}</div><span class="fw-bold text-dark">${s.username}</span></div></td>
                        <td><span class="role-badge ${roleClass}">${s.role}</span></td>
                        <td class="text-muted">${new Date(s.created_at).toLocaleDateString()}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-dark px-3 me-1" style="border-radius:10px;" onclick="openRoleModal(${s.id}, '${s.role}')"><i class="bi bi-shield-lock me-1"></i>Role</button>
                            <button class="btn btn-sm btn-outline-danger px-3" style="border-radius:10px;" onclick="deleteStaff(${s.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>`;
                }).join('');
            }

            document.getElementById('addStaffForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const res = await fetch('http://localhost:5000/api/modules/staff', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ username: document.getElementById('sUsername').value, password: document.getElementById('sPassword').value, role: document.getElementById('sRole').value })
                });
                if(res.ok) { alert('Staff Created!'); window.location.reload(); }
            });

            document.getElementById('editRoleForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('erUserId').value;
                const res = await fetch(`http://localhost:5000/api/modules/staff/${id}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ role: document.getElementById('erNewRole').value })
                });
                if(res.ok) { alert('Role Updated!'); window.location.reload(); }
            });

            loadStaff();
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
