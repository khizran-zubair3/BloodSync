<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
    .sidebar-main { 
        min-height: 100vh; 
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-right: 1px solid rgba(255, 255, 255, 0.4); 
        width: 260px; 
        position: fixed; 
        left: 0; 
        top: 0; 
        z-index: 1000; 
        padding: 25px 20px;
        box-shadow: 4px 0 24px rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
    }
    
    .sidebar-main .brand { 
        font-size: 1.6rem; 
        font-weight: 800; 
        color: var(--primary); 
        text-align: center; 
        margin-bottom: 35px; 
        padding-bottom: 15px; 
        position: relative;
    }
    
    .sidebar-main .brand::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 20%;
        width: 60%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        border-radius: 5px;
    }

    .sidebar-main .nav-link { 
        color: var(--text-muted); 
        border-radius: var(--radius-md); 
        margin-bottom: 8px; 
        font-weight: 600; 
        padding: 12px 18px; 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        display: flex; 
        align-items: center; 
        position: relative;
        overflow: hidden;
    }
    
    .sidebar-main .nav-link::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, rgba(230,57,70,0.1), transparent);
        transition: all 0.3s ease;
        z-index: 0;
    }

    .sidebar-main .nav-link:hover::before {
        width: 100%;
    }

    .sidebar-main .nav-link:hover, .sidebar-main .nav-link.active { 
        color: var(--primary); 
        background: transparent;
        transform: translateX(5px);
    }
    
    .sidebar-main .nav-link.active {
        background: linear-gradient(135deg, var(--primary) 0%, #cc0000 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        transform: none;
    }

    .sidebar-main .nav-link i { margin-right: 12px; font-size: 1.2rem; z-index: 1; }
    .sidebar-main .nav-link span { z-index: 1; }
    
    .sidebar-main .avatar { 
        background: linear-gradient(135deg, var(--primary) 0%, #cc0000 100%);
        color: white; 
        width: 50px; 
        height: 50px; 
        border-radius: 16px; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 1.4rem; 
        margin: 0 auto 15px;
        box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
    }
    
    .main-content { margin-left: 260px; padding: 30px; }
    
    .top-bar { 
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        padding: 20px 30px; 
        border-radius: var(--radius-lg); 
        box-shadow: var(--shadow-soft); 
        margin-bottom: 30px; 
        border: 1px solid rgba(255,255,255,0.5);
    }
    
    .blocked-screen { display: flex; align-items: center; justify-content: center; height: 80vh; }
    .blocked-box { 
        background: rgba(255, 255, 255, 0.8); 
        backdrop-filter: blur(10px);
        padding: 50px; 
        border-radius: var(--radius-lg); 
        text-align: center; 
        box-shadow: var(--shadow-hover);
        border: 1px solid rgba(255,255,255,0.5);
    }
</style>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar-main" id="sidebarMain">
    <div class="brand"><i class="bi bi-droplet-fill me-2"></i>BloodSync</div>
    <nav class="nav flex-column" style="flex-grow: 1; overflow-y: auto; overflow-x: hidden; margin-bottom: 20px;">
        <a class="nav-link" href="index.html" id="nav-dashboard"><i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span></a>
        <a class="nav-link" href="donors.html" id="nav-donors"><i class="bi bi-person-heart"></i> <span>Donors</span></a>
        <a class="nav-link" href="appointments.html" id="nav-appointments"><i class="bi bi-calendar2-check-fill"></i> <span>Appointments</span></a>
        <a class="nav-link" href="blood-stock.html" id="nav-stock"><i class="bi bi-droplet-fill"></i> <span>Blood Stock</span></a>
        <a class="nav-link" href="blood-requests.html" id="nav-requests"><i class="bi bi-clipboard2-pulse-fill"></i> <span>Requests</span></a>
        <a class="nav-link admin-only" href="hospitals.html" id="nav-hospitals"><i class="bi bi-hospital-fill"></i> <span>Hospitals</span></a>
        <a class="nav-link admin-only" href="equipment.html" id="nav-equipment"><i class="bi bi-tools"></i> <span>Equipment</span></a>
        <a class="nav-link admin-only" href="screening.html" id="nav-screening"><i class="bi bi-shield-fill-check"></i> <span>Screening</span></a>
        <a class="nav-link admin-only" href="staff.html" id="nav-staff"><i class="bi bi-people-fill"></i> <span>Staff Mgmt</span></a>
    </nav>
    <div class="text-center mt-auto pt-3 border-top" style="border-color: rgba(255,255,255,0.4) !important;">
        <div class="avatar"><i class="bi bi-person-fill"></i></div>
        <span id="userRoleBadge" class="badge bg-dark" style="font-size: 0.9rem; padding: 8px 15px; border-radius: 20px; background: linear-gradient(135deg, #2b2d42 0%, #1a1b28 100%) !important;">Role</span>
        <div class="mt-3 px-4">
            <button class="btn btn-outline-danger w-100" onclick="logout()" style="border-radius: var(--radius-md); font-weight: 600;">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
        </div>
    </div>
</div>

<script>
    // Highlight active link
    const currentPath = window.location.pathname.split('/').pop();
    document.querySelectorAll('.sidebar-main .nav-link').forEach(link => {
        if(link.getAttribute('href') === currentPath || (currentPath === '' && link.getAttribute('href') === 'index.html')) {
            link.classList.add('active');
        }
    });

    // Responsive Toggle Logic
    const toggleBtn = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebarMain');
    const overlay = document.getElementById('sidebarOverlay');

    if(toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('show-sidebar');
            overlay.classList.toggle('show');
        });
    }

    if(overlay) {
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show-sidebar');
            overlay.classList.remove('show');
        });
    }
</script>
