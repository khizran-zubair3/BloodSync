<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodSync - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; }
        .login-card { border: none; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .login-header { background: linear-gradient(45deg, #dc3545, #a71d2a); padding: 40px; text-align: center; color: white; }
        .login-body { padding: 40px; background: white; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #e0e0e0; }
        .form-control:focus { box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.15); border-color: #dc3545; }
        .btn-login { background: linear-gradient(45deg, #dc3545, #a71d2a); border: none; border-radius: 10px; padding: 12px; font-weight: 600; transition: 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4); color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="col-md-4">
        <div class="card login-card">
            <div class="login-header">
                <i class="bi bi-droplet-fill fs-1 mb-2"></i>
                <h2 class="fw-bold mb-0">BloodSync</h2>
                <small class="opacity-75">Bank Management System</small>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="form-label text-dark fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="loginUsername" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-dark fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="loginPassword" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger btn-login w-100 mb-3">Sign In</button>
                    <div id="loginError" class="alert alert-danger small d-none" style="border-radius:10px;"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    window.location.href = 'index.html';
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.innerText = 'Server Error! Is backend running on port 5000?';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
